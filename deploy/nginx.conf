# =====================================================================================
# Lcoalhost — nginx DU CONTENEUR `web` (docker-compose.yml), derriere le Traefik du KVM2.
# Traefik termine le TLS (Let's Encrypt) et envoie ici en HTTP sur le port 8086.
# Remplace l'ancien vhost nginx hote de la Dedibox (archive dans deploy/archive-dedibox/).
# NON VALIDE en vrai : `docker exec lh_web nginx -t` au premier deploiement.
# Site PUBLIC et INDEXABLE (pas de X-Robots-Tag noindex).
# =====================================================================================

server {
    listen 8086;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Un seul domaine canonique (Naim 26/09) : www.lcoal.host -> https://lcoal.host (301). lcoalhost.lol ne pointe pas
    # sur ce serveur : sa redirection 301 vers lcoal.host est faite chez Porkbun (URL forwarding).
    if ($host != "lcoal.host") {
        return 301 https://lcoal.host$request_uri;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    # CSP en mode RAPPORT seulement : ne casse rien. Verifier la console (lecteurs TikTok player/v1, images/videos
    # tierces, iframes PeerTube, et Google Analytics le jour ou il est branche) avant de passer en
    # Content-Security-Policy.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; img-src * data: blob:; media-src * blob:; frame-src https:; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    # IP reelle du visiteur : Traefik a deja mis X-Forwarded-For = IP client. On le TRANSMET TEL QUEL (pas
    # $proxy_add_x_forwarded_for, qui ajouterait l'IP de Traefik a la fin). Express (`trust proxy` = 1) lit le
    # dernier element -> la vraie IP du visiteur. Sinon tout le monde aurait la meme IP (celle de Traefik) : la
    # limite de requetes et l'anti-gonflage des clics pub mettraient tous les visiteurs dans le meme panier.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    location /api/ {
        proxy_pass http://127.0.0.1:4300;
        proxy_read_timeout 90s;
        client_max_body_size 10m;   # uploads "Add Coal" (COAL_MAX_MB = 8)
    }

    # Pages publiques indexables generees par le backend (Phase C) : /item/:id, sitemap, dump AEO.
    location /item/ {
        proxy_pass http://127.0.0.1:4300;
    }
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:4300;
    }
    location = /llms-full.txt {
        proxy_pass http://127.0.0.1:4300;
    }

    # Copies disque (licence libre + maison), servies directement sans passer par Node.
    location /mirror/ {
        alias /srv/mirror/;
        autoindex off;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff always;
    }

    # Petit dossier video de secours (Naim 23/09), rempli depuis frontend/public/videos par deploy-kvm2.sh.
    location /videos/ {
        alias /srv/videos/;
        autoindex off;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }

    # index.html JAMAIS en cache (audit 24/09) : apres un deploiement, un index.html garde en cache pointait vers des
    # /assets/*.js supprimes -> site casse. Un add_header ici annule ceux du server : les en-tetes de securite sont
    # donc repetes a l'identique.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; img-src * data: blob:; media-src * blob:; frame-src https:; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    }
}
