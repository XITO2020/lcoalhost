# =====================================================================================
# Lcoalhost — vhost nginx HOTE (Dedibox Pro-4-M). Meme schema que sites/conspix/deploy/nginx/.
# Fichier : /etc/nginx/sites-available/lcoalhost.lol  (lien dans sites-enabled/)
# TLS     : certbot --nginx -d lcoalhost.lol -d www.lcoalhost.lol -d lcoal.host -d www.lcoal.host
# Front   : dist/ de Vite copie dans /srv/lcoalhost/dist
# API     : conteneur lh_backend sur 127.0.0.1:4300
# Copies  : /data/lcoalhost/mirror servies directement par nginx (sans passer par Node)
# NON VALIDE localement (pas de nginx sur le PC) : `nginx -t` obligatoire avant reload.
# Difference avec Conspix : ici le site est PUBLIC et INDEXABLE (pas de X-Robots-Tag noindex).
# =====================================================================================

server {
    listen 80;
    listen [::]:80;
    server_name www.lcoalhost.lol lcoal.host www.lcoal.host;
    return 301 https://lcoalhost.lol$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name lcoalhost.lol;

    root  /srv/lcoalhost/dist;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    # CSP en mode RAPPORT seulement : ne casse rien au lancement. Ouvre la console du navigateur, verifie qu'aucune
    # violation legitime n'apparait (images/videos tierces, iframes PeerTube), puis renomme en Content-Security-Policy.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; img-src * data: blob:; media-src * blob:; frame-src https:; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    location /api/ {
        proxy_pass         http://127.0.0.1:4300;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    location /mirror/ {
        alias /data/lcoalhost/mirror/;
        autoindex off;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff always;
    }

    # Pages publiques indexables generees par le backend (23/09, SPEC-ROADMAP.md Phase C) : un snapshot HTML
    # par item + JSON-LD (/item/:id), le sitemap dynamique et le dump texte AEO — plus des fichiers statiques
    # dans dist/, donc PROXIFIES comme /api/ (meme backend, pas de SSR complet, juste ces 3 routes precises).
    location /item/ {
        proxy_pass         http://127.0.0.1:4300;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location = /sitemap.xml {
        proxy_pass         http://127.0.0.1:4300;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
    }

    location = /llms-full.txt {
        proxy_pass         http://127.0.0.1:4300;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
